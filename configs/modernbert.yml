# ModernBERT variant of the GPU experiment (scripts/slurm_poc.sh). Identical sizing
# to base.yml -- the only change under test here is the encoder architecture
# (pretrain.arch: modernbert vs bert). Applied identically to the baseline and
# caseops variants; only the tokenizer/text differs between them.
name: modernbert
marker: "↑"

data:
  train_docs: 200000
  eval_docs: 3000

tokenizer:
  vocab_size: 32000

pretrain:
  arch: modernbert
  block_size: 128
  hidden: 512
  layers: 8
  heads: 8
  intermediate: 2048
  optim: adamw_torch
  lr: 0.0005
  batch_size: 128
  epochs: 5

eval:
  max_lines: 1000
