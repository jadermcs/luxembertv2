# ModernBERT version of the GPU experiment (scripts/slurm.sh), CaseOps text.
# Identical sizing to base-caseops.yml -- the change under test here is the encoder
# architecture (pretrain.arch: modernbert vs bert). Keep every field in sync with
# modernbert-baseline.yml -- only `name` and `tokenizer.kind` may differ.
name: modernbert-caseops
marker: "↑"

data:
  train_docs: 200000
  eval_docs: 3000

tokenizer:
  kind: caseops
  vocab_size: 32000

pretrain:
  arch: modernbert
  block_size: 128
  hidden: 512
  layers: 8
  heads: 8
  intermediate: 2048
  optim: adamw_torch
  lr: 0.0005
  batch_size: 128
  epochs: 5

eval:
  max_lines: 1000
