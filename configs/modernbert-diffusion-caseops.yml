# ModernBERT trained as a masked (absorbing-state) diffusion model, CaseOps text.
# Same arch/sizing as modernbert-caseops.yml -- the change under test here is the
# training objective (pretrain.objective: diffusion vs mlm): per-example time t,
# t-dependent masking, and a hazard-weighted (1/t) NELBO loss. Keep every field in
# sync with modernbert-diffusion-baseline.yml -- only `name` and `tokenizer.kind` differ.
name: modernbert-diffusion-caseops
marker: "↑"

data:
  train_docs: 200000
  eval_docs: 3000

tokenizer:
  kind: caseops
  vocab_size: 32000

pretrain:
  arch: modernbert
  objective: diffusion
  diffusion_eps: 0.001
  block_size: 128
  hidden: 512
  layers: 8
  heads: 8
  intermediate: 2048
  optim: adamw_torch
  lr: 0.0005
  batch_size: 128
  epochs: 5

eval:
  max_lines: 1000
