# Small proof-of-concept experiment (CPU-runnable), baseline tokenizer. Keep every
# field below in sync with poc-caseops.yml -- only `name` and `tokenizer.kind` may differ,
# or the bits-per-byte comparison is no longer fair.
name: poc-baseline
marker: "↑"

data:
  train_docs: 50000
  eval_docs: 2000
  min_chars: 64

tokenizer:
  kind: baseline
  vocab_size: 16000

pretrain:
  block_size: 128
  hidden: 256
  layers: 4
  heads: 4
  intermediate: 1024
  mlm_prob: 0.15
  optim: adamw_torch
  lr: 0.0005
  weight_decay: 0.01
  batch_size: 64
  epochs: 3
  warmup_ratio: 0.05
  num_proc: 4
  seed: 42

eval:
  max_lines: 300
  block_size: 128
  micro_batch: 64
