# Small proof-of-concept experiment (CPU-runnable), CaseOps tokenizer. Keep every
# field below in sync with poc-baseline.yml -- only `name` and `tokenizer.kind` may differ,
# or the bits-per-byte comparison is no longer fair.
name: poc-caseops
marker: "↑"

data:
  train_docs: 50000
  eval_docs: 2000
  min_chars: 64

tokenizer:
  kind: caseops
  vocab_size: 16000

pretrain:
  arch: modernbert
  objective: barlow
  block_size: 128
  hidden: 256
  layers: 4
  heads: 4
  intermediate: 1024
  mlm_prob: 0.15
  optim: adamw_torch
  lr: 0.0005
  weight_decay: 0.01
  batch_size: 64
  epochs: 5
  warmup_ratio: 0.05
  num_proc: 4
  seed: 42
  barlow_weight: 1.0
  barlow_lambda: 0.005
  barlow_layer: 0

eval:
  max_lines: 300
  block_size: 128
  micro_batch: 64
