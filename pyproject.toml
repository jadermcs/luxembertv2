[project]
name = "luxbert"
version = "0.1.0"
description = "Data-efficient Luxembourgish encoder: CaseOps tokenizer vs. baseline, judged by bits-per-byte"
readme = "IDEAS.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "tokenizers>=0.20",
    "datasets>=2.20",
    "accelerate>=0.34",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luxbert"]
