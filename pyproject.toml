[project]
name = "luxbert"
version = "0.1.0"
description = "Data-efficient Luxembourgish encoder: CaseOps tokenizer vs. baseline, judged by bits-per-byte"
readme = "IDEAS.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8",
    "transformers>=5.3.0",
    "tokenizers>=0.20",
    "datasets>=2.20",
    "accelerate>=1.4",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luxbert"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
